services:
  - type: web
    name: raon-invest-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: raon-invest-db
          property: connectionString

databases:
  - name: raon-invest-db
    plan: free
    databaseName: raoninvest
